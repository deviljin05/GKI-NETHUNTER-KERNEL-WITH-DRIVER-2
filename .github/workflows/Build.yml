name: Build GKI Drivers (SimplyCEO official method, fragment merge)

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: "Artifact label"
        required: true
        default: "gki-drivers"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync GKI kernel source
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-${{ env.VERSION }}-lts --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Create driver fragment
        working-directory: kernel_workspace/common/arch/arm64/configs
        run: |
          set -euo pipefail
          cat > driver_gki.fragment << 'EOF'
          CONFIG_RTL8188EU=m
          CONFIG_CRYPTO_ARC4=m
          EOF
          echo "=== fragment ==="
          cat driver_gki.fragment

      - name: Patch build.config.db845c (FRAGMENT_CONFIG + PRE_DEFCONFIG_CMDS)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          # db845c build config use karo, lekin fragment merge karo
          cat > build.config.driver << 'EOF'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.common
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.aarch64
          BUILD_INITRAMFS=1
          DEFCONFIG=gki_defconfig
          FRAGMENT_CONFIG=${KERNEL_DIR}/arch/arm64/configs/driver_gki.fragment
          PRE_DEFCONFIG_CMDS="KCONFIG_CONFIG=${ROOT_DIR}/${KERNEL_DIR}/arch/arm64/configs/${DEFCONFIG} ${ROOT_DIR}/${KERNEL_DIR}/scripts/kconfig/merge_config.sh -m -r ${ROOT_DIR}/${KERNEL_DIR}/arch/arm64/configs/gki_defconfig ${ROOT_DIR}/${FRAGMENT_CONFIG}"
          POST_DEFCONFIG_CMDS="rm ${ROOT_DIR}/${KERNEL_DIR}/arch/arm64/configs/${DEFCONFIG}"
          MAKE_GOALS="Image.lz4 modules"
          EOF
          echo "=== build.config.driver created ==="
          cat build.config.driver

      - name: Patch build.config.gki.aarch64 for fragment support
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          # GKI_DEFCONFIG_FRAGMENT support already exists in build.config.gki.aarch64
          # Verify
          tail -5 build.config.gki.aarch64

      - name: Build kernel (fragment merge)
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="ci"
          export GKI_DEFCONFIG_FRAGMENT="${ROOT_DIR}/common/arch/arm64/configs/driver_gki.fragment"
          LTO=thin \
          SKIP_MRPROPER=1 \
          BUILD_CONFIG=common/build.config.driver \
          USE_CCACHE=1 \
          CCACHE_DIR="${{ env.CCACHE_DIR }}" \
          build/build.sh -j"$(nproc)"

      - name: Clone SimplyCEO rtl8188eus driver
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.com/SimplyCEO/rtl8188eus.git rtl8188eus

          sed -i 's/---help---/help/g' rtl8188eus/Kconfig || true

          PHYDM=rtl8188eus/hal/phydm/phydm_debug.c
          if [ -f "$PHYDM" ]; then
            sed -i \
              's/strnlen(argv\[0\], sizeof argv)/strnlen(argv[0], sizeof argv[0])/' \
              "$PHYDM"
          fi

          sed -i 's/^CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' rtl8188eus/Makefile
          sed -i 's/^CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/' rtl8188eus/Makefile

          echo "=== Makefile platform config ==="
          grep -n 'CONFIG_PLATFORM_I386_PC\|CONFIG_PLATFORM_ARM64_RPI' rtl8188eus/Makefile

      - name: Build 8188eu.ko
        working-directory: ${{ github.workspace }}/rtl8188eus
        run: |
          set -euo pipefail
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KSRC=$GITHUB_WORKSPACE/kernel_workspace/common \
            KVER=5.10 \
            2>&1 | tee build.log || true

          echo "=== find .ko ==="
          find . -name "*.ko" -type f || true
          ls -la *.ko 2>/dev/null || echo "no .ko in root"

      - name: Collect 8188eu.ko
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p out
          if [ -d rtl8188eus ]; then
            find rtl8188eus -name "8188eu.ko" -exec cp {} out/ \; || true
            find rtl8188eus -name "*.ko" -exec cp {} out/ \; || true
          fi
          echo "=== out tree ==="
          ls -la out/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-drivers
          path: |
            ${{ github.workspace }}/out/**/*
            ${{ github.workspace }}/rtl8188eus/build.log
          if-no-files-found: warn
          retention-days: 14
