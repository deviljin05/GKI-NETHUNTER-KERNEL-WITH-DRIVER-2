name: Build GKI Drivers (aircrack-ng rtl8188eus only)

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: "Artifact label"
        required: true
        default: "gki-drivers"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up ccache
        run: mkdir -p "${{ env.CCACHE_DIR }}"

      - name: Sync GKI kernel source
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-${{ env.VERSION }}-lts --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Add aircrack-ng rtl8188eus driver (in-tree, latest master)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/aircrack-ng/rtl8188eus \
            drivers/net/wireless/rtl8188eus

          # Kbuild hook: unconditional obj-m, no CONFIG_* symbol needed
          if ! grep -q 'rtl8188eus/' drivers/net/wireless/Makefile; then
            echo 'obj-m += rtl8188eus/' >> drivers/net/wireless/Makefile
          fi

          # Older Kconfig syntax — naye parser reject karte hain
          sed -i 's/---help---/help/g' drivers/net/wireless/rtl8188eus/Kconfig || true

          # phydm_debug.c: sizeof(argv) (whole array, 320 bytes) was used
          # instead of sizeof(argv[0]) (one row, 16 bytes) as strnlen bound.
          # Newer GCC flags this as -Werror=stringop-overread.
          PHYDM=drivers/net/wireless/rtl8188eus/hal/phydm/phydm_debug.c
          if [ -f "$PHYDM" ]; then
            sed -i \
              's/strnlen(argv\[0\], sizeof argv)/strnlen(argv[0], sizeof argv[0])/' \
              "$PHYDM"
          fi

          echo "=== tail of wireless/Makefile ==="
          tail -5 drivers/net/wireless/Makefile

      - name: Add driver configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_PACKET_DIAG=y"
            echo "CONFIG_USB_G_HID=y"
            echo "CONFIG_USB_CONFIGFS_F_HID=y"
            echo "CONFIG_FW_LOADER=y"
            echo "CONFIG_FW_LOADER_USER_HELPER=y"
            echo "CONFIG_USB_SUPPORT=y"
            echo "CONFIG_USB_NET_DRIVERS=y"
            echo "CONFIG_USB_USBNET=y"
            echo "CONFIG_USB_CDC_COMPOSITE=y"
            echo "CONFIG_USB_CONFIGFS=y"
            echo "CONFIG_USB_CONFIGFS_ACM=y"
            echo "CONFIG_USB_CONFIGFS_RNDIS=y"
            echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y"
            echo "CONFIG_USB_ACM=y"
            echo "CONFIG_USB_SERIAL=y"
            echo "CONFIG_USB_SERIAL_GENERIC=y"
            echo "CONFIG_USB_SERIAL_CP210X=y"
            echo "CONFIG_USB_SERIAL_FTDI_SIO=y"
            echo "CONFIG_USB_SERIAL_PL2303=y"
            echo "CONFIG_USB_SERIAL_CH341=y"
            echo "CONFIG_USB_SERIAL_ARK3116=y"
            echo "CONFIG_USB_NET_CDCETHER=y"
            echo "CONFIG_USB_NET_CDC_NCM=y"
            echo "CONFIG_USB_NET_RNDIS_HOST=y"
            echo "CONFIG_USB_NET_RNDIS_WLAN=y"
            echo "CONFIG_RFKILL=y"
            echo "CONFIG_RFKILL_LEDS=y"
            echo "CONFIG_BT=y"
            echo "CONFIG_BT_L2CAP=y"
            echo "CONFIG_BT_SCO=y"
            echo "CONFIG_BT_RFCOMM=y"
            echo "CONFIG_BT_BNEP=y"
            echo "CONFIG_BT_HIDP=y"
            echo "CONFIG_BT_HCIUART_H4=y"
            echo "CONFIG_BT_HCIUART_BCSP=y"
            echo "CONFIG_BT_HCIUART_LL=y"
            echo "CONFIG_CAN=y"
