name: Build 8188eu driver only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc-aarch64-linux-gnu bc flex bison \
            libssl-dev libelf-dev python3 python3-pip cpio rsync kmod

      - name: Clone ACK kernel source (android12-5.10-lts)
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          git clone --depth 1 \
            -b android12-5.10-lts \
            https://android.googlesource.com/kernel/common \
            kernel_common
          cd kernel_common
          echo "=== HEAD commit ==="
          git log --oneline -1
          head -5 Makefile

      - name: Configure kernel (gki_defconfig)
        working-directory: ${{ github.workspace }}/kernel_common
        run: |
          set -eux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_RTL8188EU=m
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_MAC80211_LEDS=y
          CONFIG_CRYPTO_ARC4=m
          CONFIG_CRYPTO_MICHAEL_MIC=m
          CONFIG_CRC_CCITT=m
          CONFIG_CRC_ITU_T=m
          EOF
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel (vmlinux + modules → Module.symvers)
        working-directory: ${{ github.workspace }}/kernel_common
        run: |
          set -eux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          echo "=== building vmlinux ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux
          echo "=== building modules (generates Module.symvers) ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules
          echo "=== Module.symvers check ==="
          ls -la Module.symvers
          wc -l Module.symvers
          cat include/config/kernel.release

      - name: Clone SimplyCEO rtl8188eus driver
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          git clone --depth 1 https://github.com/SimplyCEO/rtl8188eus /tmp/rtl8188eus
          mkdir -p driver
          cp -r /tmp/rtl8188eus/* driver/
          rm -rf /tmp/rtl8188eus
          echo "=== driver files ==="
          ls driver/ | head -20

      - name: Prepare driver (fixes + custom Makefile)
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          DRV=driver

          # FIX 1: Kconfig syntax
          sed -i 's/---help---/help/g' "$DRV/Kconfig" || true

          # FIX 2: Remove unsupported warning flags
          find "$DRV" -name 'Makefile' -type f | while read -r f; do
            sed -i 's/-Wno-cast-function-type//g' "$f" || true
            sed -i 's/-Wno-misleading-indentation//g' "$f" || true
            sed -i 's/-Werror=unused-but-set-variable//g' "$f" || true
            sed -i 's/-Werror=maybe-uninitialized//g' "$f" || true
            sed -i 's/-Werror=unused-variable//g' "$f" || true
            sed -i 's/-Werror=unused-function//g' "$f" || true
            sed -i 's/-Werror=array-bounds//g' "$f" || true
          done

          # FIX 3: usb_halinit.c parentheses
          sed -i 's/if ((IS_FULL_SPEED_USB(Adapter))/if (IS_FULL_SPEED_USB(Adapter)/g' \
            "$DRV/hal/rtl8188e/usb/usb_halinit.c" || true

          # FIX 4: phydm_debug.c tautological
          if [ -f "$DRV/hal/phydm/phydm_debug.c" ]; then
            sed -i 's/rx_ht != 2 || rx_ht != 1/rx_ht != 2 \&\& rx_ht != 1/g' \
              "$DRV/hal/phydm/phydm_debug.c" || true
          fi

          # FIX 5: Add 0bda:8176 (RTL8188CUS)
          if [ -f "$DRV/os_dep/linux/usb_intf.c" ]; then
            if ! grep -q '0x8176' "$DRV/os_dep/linux/usb_intf.c"; then
              sed -i 's/{USB_DEVICE(0x0bda, 0x8179)}/{USB_DEVICE(0x0bda, 0x8179)}, {USB_DEVICE(0x0bda, 0x8176)}/g' \
                "$DRV/os_dep/linux/usb_intf.c" || true
            fi
          fi

          # FIX 6: Copy include headers to source folders (fallback for drv_types.h)
          if [ -d "$DRV/include" ]; then
            cp -r "$DRV/include/"* "$DRV/core/" 2>/dev/null || true
            for d in core os_dep/linux hal hal/rtl8188e hal/phydm; do
              if [ -d "$DRV/$d" ]; then
                cp -r "$DRV/include/"* "$DRV/$d/" 2>/dev/null || true
              fi
            done
          fi

          # FIX 7: Create custom Makefile
          cat > "$DRV/Makefile" << 'MAKEFILE_EOF'
          obj-$(CONFIG_RTL8188EU) += 8188eu.o
          8188eu-objs := \
              core/rtw_cmd.o \
              core/rtw_security.o \
              core/rtw_debug.o \
              core/rtw_io.o \
              core/rtw_ioctl_query.o \
              core/rtw_ioctl_set.o \
              core/rtw_ieee80211.o \
              core/rtw_mlme.o \
              core/rtw_mlme_ext.o \
              core/rtw_mi.o \
              core/rtw_wlan_util.o \
              core/rtw_vht.o \
              core/rtw_pwrctrl.o \
              core/rtw_rf.o \
              core/rtw_recv.o \
              core/rtw_sta_mgt.o \
              core/rtw_ap.o \
              core/rtw_xmit.o \
              core/rtw_p2p.o \
              core/rtw_rson.o \
              core/rtw_tdls.o \
              core/rtw_br_ext.o \
              core/rtw_iol.o \
              core/rtw_sreset.o \
              core/rtw_btcoex_wifionly.o \
              core/rtw_btcoex.o \
              core/rtw_beamforming.o \
              core/rtw_odm.o \
              core/rtw_rm.o \
              core/rtw_rm_fsm.o \
              core/efuse/rtw_efuse.o \
              os_dep/osdep_service.o \
              os_dep/linux/os_intfs.o \
              os_dep/linux/usb_intf.o \
              os_dep/linux/usb_ops_linux.o \
              os_dep/linux/ioctl_linux.o \
              os_dep/linux/xmit_linux.o \
              os_dep/linux/mlme_linux.o \
              os_dep/linux/recv_linux.o \
              os_dep/linux/ioctl_cfg80211.o \
              os_dep/linux/rtw_cfgvendor.o \
              os_dep/linux/wifi_regd.o \
              os_dep/linux/rtw_android.o \
              os_dep/linux/rtw_proc.o \
              os_dep/linux/rtw_rhashtable.o \
              os_dep/linux/ioctl_mp.o \
              hal/hal_intf.o \
              hal/hal_com.o \
              hal/hal_com_phycfg.o \
              hal/hal_phy.o \
              hal/hal_dm.o \
              hal/hal_dm_acs.o \
              hal/hal_btcoex_wifionly.o \
              hal/hal_btcoex.o \
              hal/hal_mp.o \
              hal/hal_mcc.o \
              hal/hal_hci/hal_usb.o \
              hal/led/hal_led.o \
              hal/led/hal_usb_led.o \
              hal/HalPwrSeqCmd.o \
              hal/rtl8188e/Hal8188EPwrSeq.o \
              hal/rtl8188e/rtl8188e_xmit.o \
              hal/rtl8188e/rtl8188e_sreset.o \
              hal/rtl8188e/rtl8188e_hal_init.o \
              hal/rtl8188e/rtl8188e_phycfg.o \
              hal/rtl8188e/rtl8188e_rf6052.o \
              hal/rtl8188e/rtl8188e_dm.o \
              hal/rtl8188e/rtl8188e_rxdesc.o \
              hal/rtl8188e/rtl8188e_cmd.o \
              hal/rtl8188e/hal8188e_s_fw.o \
              hal/rtl8188e/hal8188e_t_fw.o \
              hal/rtl8188e/usb/usb_halinit.o \
              hal/rtl8188e/usb/rtl8188eu_led.o \
              hal/rtl8188e/usb/rtl8188eu_xmit.o \
              hal/rtl8188e/usb/rtl8188eu_recv.o \
              hal/rtl8188e/usb/usb_ops_linux.o \
              hal/efuse/rtl8188e/HalEfuseMask8188E_USB.o \
              hal/phydm/phydm_debug.o \
              hal/phydm/phydm_antdiv.o \
              hal/phydm/phydm_soml.o \
              hal/phydm/phydm_smt_ant.o \
              hal/phydm/phydm_antdect.o \
              hal/phydm/phydm_interface.o \
              hal/phydm/phydm_phystatus.o \
              hal/phydm/phydm_hwconfig.o \
              hal/phydm/phydm.o \
              hal/phydm/phydm_dig.o \
              hal/phydm/phydm_pathdiv.o \
              hal/phydm/phydm_rainfo.o \
              hal/phydm/phydm_dynamictxpower.o \
              hal/phydm/phydm_adaptivity.o \
              hal/phydm/phydm_cfotracking.o \
              hal/phydm/phydm_noisemonitor.o \
              hal/phydm/phydm_beamforming.o \
              hal/phydm/phydm_dfs.o \
              hal/phydm/txbf/halcomtxbf.o \
              hal/phydm/txbf/haltxbfinterface.o \
              hal/phydm/txbf/phydm_hal_txbf_api.o \
              hal/phydm/phydm_adc_sampling.o \
              hal/phydm/phydm_ccx.o \
              hal/phydm/phydm_psd.o \
              hal/phydm/phydm_primary_cca.o \
              hal/phydm/phydm_cck_pd.o \
              hal/phydm/phydm_rssi_monitor.o \
              hal/phydm/phydm_auto_dbg.o \
              hal/phydm/phydm_math_lib.o \
              hal/phydm/phydm_pow_train.o \
              hal/phydm/halrf/halrf.o \
              hal/phydm/halrf/halphyrf_ce.o \
              hal/phydm/halrf/halrf_powertracking_ce.o \
              hal/phydm/halrf/halrf_powertracking.o \
              hal/phydm/halrf/halrf_kfree.o \
              hal/phydm/rtl8188e/halhwimg8188e_mac.o \
              hal/phydm/rtl8188e/halhwimg8188e_bb.o \
              hal/phydm/rtl8188e/halhwimg8188e_rf.o \
              hal/phydm/halrf/rtl8188e/halrf_8188e_ce.o \
              hal/phydm/rtl8188e/phydm_regconfig8188e.o \
              hal/phydm/rtl8188e/hal8188erateadaptive.o \
              hal/phydm/rtl8188e/phydm_rtl8188e.o \
              platform/platform_ops.o \
              core/rtw_mp.o

          ccflags-y += -I$(srctree)/$(src)/include
          ccflags-y += -I$(srctree)/$(src)/os_dep/linux
          ccflags-y += -I$(srctree)/$(src)/hal
          MAKEFILE_EOF

          echo "=== custom Makefile created ==="
          head -20 "$DRV/Makefile"

      - name: Build 8188eu.ko
        working-directory: ${{ github.workspace }}/driver
        run: |
          set -eux
          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -C $GITHUB_WORKSPACE/kernel_common \
            M=$PWD \
            modules 2>&1 | tee build.log || true
          echo "=== find .ko ==="
          find . -name "*.ko" -type f || true
          ls -la *.ko 2>/dev/null || echo "no .ko in root"

      - name: Collect 8188eu.ko
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p out
          if [ -d driver ]; then
            find driver -name "8188eu.ko" -exec cp {} out/ \; || true
            find driver -name "*.ko" -exec cp {} out/ \; || true
          fi
          if [ -f kernel_common/include/config/kernel.release ]; then
            cp kernel_common/include/config/kernel.release out/ || true
          fi
          if [ -d kernel_common ]; then
            cd kernel_common && git log --oneline -1 > ../out/kernel-commit.txt || true
          fi
          echo "=== out tree ==="
          ls -la out/ || true

      - name: Show modinfo
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          for f in out/*.ko; do
            echo "=== $f ==="
            modinfo "$f" || true
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-ko
          path: |
            ${{ github.workspace }}/out/**/*
            ${{ github.workspace }}/driver/build.log
          if-no-files-found: warn
