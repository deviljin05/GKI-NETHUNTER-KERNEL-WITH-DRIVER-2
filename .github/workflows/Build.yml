name: Build 8188eu driver only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc-aarch64-linux-gnu bc flex bison \
            libssl-dev libelf-dev python3 python3-pip cpio rsync kmod

      - name: Clone ACK kernel source (android12-5.10-lts)
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          git clone --depth 1 \
            -b android12-5.10-lts \
            https://android.googlesource.com/kernel/common \
            kernel_common
          cd kernel_common
          echo "=== HEAD commit ==="
          git log --oneline -1
          head -5 Makefile

      - name: Configure kernel (gki_defconfig)
        working-directory: ${{ github.workspace }}/kernel_common
        run: |
          set -eux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          # Harmless insurance: some driver Makefiles gate obj-m on this
          # kernel-config symbol. It's ignored if unused.
          cat >> arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_RTL8188EU=m
          EOF
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel (vmlinux + modules → Module.symvers)
        working-directory: ${{ github.workspace }}/kernel_common
        run: |
          set -eux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          echo "=== building vmlinux ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux
          echo "=== building modules (generates Module.symvers) ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules
          echo "=== Module.symvers check ==="
          ls -la Module.symvers
          wc -l Module.symvers
          cat include/config/kernel.release

      - name: Clone SimplyCEO rtl8188eus driver
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          git clone --depth 1 https://github.com/SimplyCEO/rtl8188eus driver
          echo "=== driver files ==="
          ls driver/

      - name: Inspect driver Makefile for the kernel-path variable
        working-directory: ${{ github.workspace }}/driver
        run: |
          set -eux
          echo "=== looking for KSRC / KDIR / KERNELDIR / KERNEL_DIR usage ==="
          grep -nE '\bK(SRC|DIR|ERNELDIR|ERNEL_DIR|ERNEL_SRC)\b' Makefile | head -30 || true
          echo "=== looking for the module build target (all/modules) ==="
          grep -nE '^(all|modules)\s*:' Makefile || true
          echo "=== MODULE_NAME assembly (sanity check) ==="
          grep -n 'MODULE_NAME' Makefile | head -20 || true

      - name: Minimal source fixes (Kconfig syntax only)
        working-directory: ${{ github.workspace }}/driver
        run: |
          set -eux
          # Older Kconfig syntax some kernels' Kconfig parser rejects.
          sed -i 's/---help---/help/g' Kconfig || true

      - name: Build 8188eu.ko (using the driver's own Makefile)
        working-directory: ${{ github.workspace }}/driver
        run: |
          set -eux
          # Pass every common kernel-path variable name; whichever one the
          # driver's Makefile actually reads will be honored, the rest are
          # simply unused. This avoids depending on one guessed name.
          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KSRC=$GITHUB_WORKSPACE/kernel_common \
            KDIR=$GITHUB_WORKSPACE/kernel_common \
            KERNELDIR=$GITHUB_WORKSPACE/kernel_common \
            KERNEL_DIR=$GITHUB_WORKSPACE/kernel_common \
            2>&1 | tee build.log
          echo "=== find .ko ==="
          find . -name "*.ko" -type f
          ls -la *.ko 2>/dev/null || echo "no .ko in driver root"

      - name: Collect 8188eu.ko
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p out
          if [ -d driver ]; then
            find driver -name "*.ko" -exec cp {} out/ \; || true
          fi
          if [ -f kernel_common/include/config/kernel.release ]; then
            cp kernel_common/include/config/kernel.release out/ || true
          fi
          if [ -d kernel_common ]; then
            cd kernel_common && git log --oneline -1 > ../out/kernel-commit.txt || true
          fi
          echo "=== out tree ==="
          ls -la out/ || true

      - name: Show modinfo
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          for f in out/*.ko; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            modinfo "$f" || true
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-ko
          path: |
            ${{ github.workspace }}/out/**/*
            ${{ github.workspace }}/driver/build.log
          if-no-files-found: warn
